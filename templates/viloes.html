{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-[#111] text-white py-20 min-h-screen relative">
    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20 pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-8 relative z-10">
        
        <div class="flex flex-col md:flex-row justify-between items-end mb-12 border-b border-[#393939] pb-6">
            <div>
                <h3 class="font-bebas text-2xl text-green-500 tracking-widest mb-1">ARQUIVO DE AMEAÇAS MAXIMAS</h3>
                <h2 class="font-bebas text-6xl tracking-wider">GALERIA DE VILÕES</h2>
            </div>
            
            <button onclick="abrirModalVilao()" class="bg-green-600 hover:bg-green-700 text-white font-bebas text-xl px-8 py-4 skew-x-[-10deg] transition mt-6 md:mt-0 shadow-[0_0_15px_rgba(22,163,74,0.4)]">
                <span class="block skew-x-[10deg]">+ REGISTRAR NOVA AMEAÇA</span>
            </button>
        </div>

        <div id="lista-pagina-viloes" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
            </div>

    </div>
</section>
{% endblock %}
